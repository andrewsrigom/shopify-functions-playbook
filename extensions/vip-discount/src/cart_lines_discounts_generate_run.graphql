query CartLinesDiscountsGenerateRunInput {
  cart {
    buyerIdentity {
      customer {
        hasAnyTag(tags: ["playbook-vip"])
      }
    }
    lines {
      id
      quantity
    }
  }
  discount {
    config: metafield(namespace: "$app", key: "config") {
      jsonValue
    }
    discountClasses
  }
}

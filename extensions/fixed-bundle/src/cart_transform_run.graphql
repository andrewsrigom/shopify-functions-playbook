query CartTransformRunInput {
  cart {
    lines {
      id
      quantity
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
        }
      }
    }
  }
  cartTransform {
    config: metafield(namespace: "$app", key: "config") {
      jsonValue
    }
  }
}
